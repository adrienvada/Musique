# Déploie le connecteur « Portée reMarkable » (fonction Supabase) dès que
# son code change. Deux secrets du dépôt : SUPABASE_ACCESS_TOKEN (le jeton
# d'accès Supabase) et PORTEE_CLE (la clé de l'adresse du connecteur). Le
# dépôt est public, ses journaux aussi : la clé n'y apparaît jamais, et sans
# elle le connecteur est verrouillé.
name: Connecteur reMarkable

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/portee-remarkable/**"
      - "outils/deployer-connecteur.mjs"
      - ".github/workflows/connecteur.yml"
  workflow_dispatch:

concurrency: connecteur

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PORTEE_CLE: ${{ secrets.PORTEE_CLE }}
      # Le projet du site (décision : Musique vit dans le projet du site).
      SUPABASE_PROJET: ${{ vars.SUPABASE_PROJET || 'omekkqjinvppadsoinvj' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Déployer
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Pas de secret SUPABASE_ACCESS_TOKEN : rien à déployer (docs/PROPOSITIONS.md, « Brancher la reMarkable »)."
            exit 0
          fi
          npm run connecteur -- "$SUPABASE_PROJET"
