# Déploie le connecteur « Portée reMarkable » (fonction Supabase) dès que
# son code change. Le jeton d'accès Supabase vit dans les secrets du dépôt
# (SUPABASE_ACCESS_TOKEN) : il ne passe ni par la conversation ni par un
# terminal. Au premier déploiement, l'adresse du connecteur apparaît dans le
# résumé de l'exécution (dépôt privé : toi seul la vois).
name: Connecteur reMarkable

on:
  push:
    # ccr-6b1e284f-bv8j0c : la branche de la PR #1, à retirer une fois fusionnée.
    branches: [main, ccr-6b1e284f-bv8j0c]
    paths:
      - "supabase/functions/portee-remarkable/**"
      - "outils/deployer-connecteur.mjs"
      - ".github/workflows/connecteur.yml"
  workflow_dispatch:

concurrency: connecteur

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Le projet du site (décision : Musique vit dans le projet du site).
      SUPABASE_PROJET: ${{ vars.SUPABASE_PROJET || 'omekkqjinvppadsoinvj' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Déployer
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Pas de secret SUPABASE_ACCESS_TOKEN : rien à déployer (docs/PROPOSITIONS.md, « Brancher la reMarkable »)."
            exit 0
          fi
          npm run connecteur
          npm run connecteur -- "$SUPABASE_PROJET"
