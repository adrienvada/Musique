# Publie Portée sur GitHub Pages (https://adrienvada.fr/Musique/, le domaine du
# site d'Adrien ; adrienvada.github.io/Musique/ y redirige) à chaque
# changement sur main : vérifications, assemblage de la version autonome
# (npm run appli -- --autonome), puis mise en ligne. Sur une PR : les mêmes
# vérifications et l'assemblage, sans mise en ligne.
#
# Une fois pour toutes : Settings → Pages → Build and deployment → Source :
# « GitHub Actions ».
#
# Les actions sont épinglées par empreinte (une étiquette « v4 » peut être
# déplacée vers un autre code), la version en commentaire ; Dependabot les
# tient à jour (.github/dependabot.yml). Aucune étape ne garde le jeton
# GitHub (persist-credentials: false), et seul le job qui publie a le droit
# d'écrire, sur Pages seulement.
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tout ce que CLAUDE.md demande avant de pousser : les tests, le lint, les
  # types, les essais de bout en bout dans Chromium, et deno check pour le
  # connecteur (la vérification que fait Supabase à sa mise en ligne).
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Aucun script d'installation de dépendance ne s'exécute.
      - run: npm ci --ignore-scripts
      # Le Chromium de la version de Playwright figée par package.json.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run lint
      - run: npm run types
      - run: npm run e2e
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/portee-remarkable/index.ts

  assembler:
    needs: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run appli -- --autonome
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  publier:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: assembler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
